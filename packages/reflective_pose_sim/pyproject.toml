[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reflective_pose_sim"
version = "0.1.0"
description = "Synthetic VLP-32C scans and indoor scenes for the reflective board detector"
# No requires-python. setuptools >= 61 reads this [project] table during
# colcon's setup.py introspection and stores requires-python as a
# SpecifierSet, whose repr (<SpecifierSet('>=3.8')>) colcon-python-setup-py
# then fails to ast.literal_eval: "invalid syntax", and the package does
# not build. Every supported target runs Python 3.10 anyway.
license = { text = "Apache-2.0" }
maintainers = [{ name = "Golf Cart Team", email = "dev@golfcart.org" }]
dependencies = [
    "numpy",
    "reflective_pose_core",
]

[tool.setuptools]
packages = ["reflective_pose_sim"]
zip-safe = true
