# The handoff policy for board_pose_initializer: how a detected pose becomes a
# call to Autoware's pose initializer. Properties of the vehicle stack, not of
# the board, which is why this is not part of the detector file.
#
# Every key here is a field of Policy in initializer_node.py, and the values
# are the node's own defaults; a test holds the two together.
/**:
  ros__parameters:
    initialize_service: /localization/initialize
    max_speed_for_init: 0.05          # [m/s]
    max_attempts: 5
    # Off by default: a silent fallback to a fixed pose turns a detector
    # failure into a mislocalization report three weeks later.
    fallback_to_user_defined_pose: false

    # How long to wait for a board pose before the attempt budget counts one
    # as spent, counted from the last pose seen, acted on or not. Zero disables
    # it.
    #
    # Detection and the service call are two processes, so an attempt is one
    # pose acted on: a detector that never detects spends no attempts and the
    # fallback never runs. This bounds that case.
    pose_wait_timeout: 60.0

    # Least time between two service calls, so a refused call retried on the
    # detector's next pose (100 ms away) cannot spend the budget in a second.
    min_attempt_spacing: 1.0

    # Failed attempts made before the scan matcher has published its loaded
    # map (/localization/pose_estimator/debug/loaded_pointcloud_map) do not
    # count against max_attempts. A cart parked at the board while the stack
    # boots is detected long before the map reaches the matcher, and every
    # align until then fails for that reason alone.
    ignore_failures_before_map: true

    # Readiness: act on a board pose only when the stack can take one. Autoware's
    # pose initializer refuses while it has no wheel speed ("The vehicle is not
    # stopped") and while NDT has no scan ("align server failed"); a call then
    # spends an attempt for nothing. Off by default.
    require_velocity: false
    # NDT's input cloud, e.g. /localization/util/downsample/pointcloud. Empty: no check.
    ready_pointcloud_topic: ""
    # How recent the last VelocityReport / cloud must be [s].
    ready_timeout: 1.0
    # With require_velocity: how long the wheel speed must have reported a stop, unbroken
    # [s]. Autoware's stop check (stop_check_duration) wants a buffer of twists this long.
    stopped_for: 3.0
