# Detector contract shared by the runtime node and map anchoring tool.
#
# Every absolute height below is measured from physical ground. Runtime TF
# points are expressed in base_link, so detector.runtime adds
# base_link_height_above_ground before applying its height gates. Map points are
# levelled with floor z=0, so detector.map uses no height_min/height_max; its
# required AABB owns the complete map spatial crop, including Z.
#
# Use signed -.inf / .inf for unbounded AABB sides. An empty YAML value is not a
# second spelling for an unbounded side.

board:
  # [x, y, z, roll, pitch, yaw], radians. z is the board centre in the output
  # map; detector policy heights below are the ground-relative measurements.
  pose_in_map: [0.0, 0.0, 1.300, 0.0, 0.0, 0.0]
  width: 0.6
  height: 0.6

detector:
  # VLP-32C calibrated reflectivity. 100 is the lowest value that admitted
  # every replayed board scan; geometry and confidence reject other reflectors.
  intensity_threshold: 100.0
  azimuth_step_rad: 0.0035
  min_confidence: 0.6

  runtime:
    # Positive offset: z_ground = z_base_link + this value. The real
    # base_link <- sensor TF remains unchanged for range and pose calculations.
    # This scalar assumes base_link z is aligned with gravity; use a
    # gravity-aligned height frame if the vehicle has meaningful roll/pitch.
    base_link_height_above_ground: 0.265
    range_min: 3.0
    range_max: 18.0
    # Ground-relative point-height gate, applied after the offset above.
    height_min: 0.7
    height_max: 1.9
    cluster_tolerance: 0.20
    cluster_min_points: 60
    board_centre_height: 1.3
    extent_tolerance: [0.8, 1.5]
    planarity_max_thickness: 0.08
    verticality_max_dot: 0.25
    centre_height_tolerance: 0.30
    density_max_ratio: 1.4
    density_check_enabled: true

  map:
    # Required inclusive crop in the levelled, floor-zero map_debug frame.
    # The AABB z slab is the map point-height filter; do not add height_min or
    # height_max here. Ideally this board centre matches pose_in_map[2] when
    # the runtime offset and floor fit are correct and map ground is z=0.
    aabb:
      min: [-20, -20, 0.4]
      max: [20, 20, 1.7]
    range_min: 0.0
    range_max: .inf
    cluster_tolerance: 0.05
    cluster_min_points: 200
    board_centre_height: 1.1
    extent_tolerance: [0.8, 1.5]
    planarity_max_thickness: 0.08
    verticality_max_dot: 0.25
    centre_height_tolerance: 1.0
    density_max_ratio: 1.4
    density_check_enabled: false

covariance:
  # Loose on purpose: the pose is a guess for a scan matcher to refine.
  sigma_xy_base: 0.15
  sigma_xy_per_metre: 0.03
  sigma_z: 0.10
  sigma_yaw_base: 0.05
  sigma_roll_pitch: 0.02
  safety_factor: 2.0
  unconstrained_axis_sigma: 1.0
