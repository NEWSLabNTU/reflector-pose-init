# Canonical configuration for the reflective board detector.
#
# One file, five sections, read by every package:
#
#   board:      shared truth. Both the runtime node and the offline anchoring
#               tool read it, so the map and the pose guess cannot drift apart.
#   detector:   reflective_pose_core, detection gates
#   anchor:     reflective_pose_core, offline anchoring
#   covariance: reflective_pose_ros, the guess covariance it publishes
#   ros:        reflective_pose_ros, wiring only
#   autoware:   reflective_pose_autoware, handoff policy
#
# The numbers below are measurements where a comment says so. Read the comment
# before changing the value.

board:
  # [x, y, z, roll, pitch, yaw]. Rotation is intrinsic Rz(yaw) @ Ry(pitch) @
  # Rx(roll); angles are radians. Shared by runtime init and offline anchoring.
  pose_in_map: [0.0, 0.0, 1.300, 0.0, 0.0, 0.0]
  width: 0.6
  height: 0.6

detector:
  # VLP-32C reports calibrated reflectivity: 0-100 diffuse, 101-255 reserved
  # for retroreflectors. This threshold is a sensor contract, not a tuning.
  intensity_threshold: 150.0
  azimuth_step_rad: 0.0035          # 0.2 deg at 600 rpm / 10 Hz

  runtime:
    # These heights are in base_link. On this vehicle base_link is at the
    # rear axle centre, so the floor is approximately -one wheel radius.
    height_reference: base_link
    floor_height_in_frame: -0.265
    # Omit the centre gate's absolute value so it is derived from the shared
    # board height in the anchored map plus the base_link floor offset. This
    # assumes board.pose_in_map[2] uses the canonical floor datum; set an
    # explicit value if a deployment uses another vertical datum.
    board_centre_height: null       # auto-derived; not an unbounded value
    # Below 3 m the board falls into the sparse lower elevation band, where the
    # 9.4 deg gap between the -25.0 and -15.6 deg beams disconnects its bottom
    # third from the rest of the cluster. Measured in simulation, not guessed.
    range_min: 3.0
    range_max: 18.0
    height_min: 0.5
    height_max: 1.5

    # Governed by across-ring spacing, not within-ring spacing.
    cluster_tolerance: 0.20
    cluster_min_points: 60
    extent_tolerance: [0.8, 1.5]      # fraction of nominal
    planarity_max_thickness: 0.08
    verticality_max_dot: 0.25
    centre_height_tolerance: 0.30
    density_max_ratio: 1.4
    density_check_enabled: true

  map:
    # The CLI levels the cloud so this frame's floor is z=0. The source PLY's
    # arbitrary z origin never enters this gate.
    height_reference: map_floor
    floor_height_in_frame: 0.0
    # Optional spatial crop for map anchoring. Bounds are inclusive and are
    # expressed in the levelled, floor-zero map_debug frame. This is applied
    # only to detection; floor fitting, viewpoint calculation, and the output
    # map still use the full cloud. Use -.inf for an unbounded lower axis and
    # .inf for an unbounded upper axis. These Z bounds replace the old
    # map.height_min/map.height_max settings.
    aabb:
      min: [-20, -20, 0.5]
      max: [20, 20, 1.1]
    # To restrict XY as well, replace the infinities with finite map_debug values:
    #   min: [-5.0, -3.0, 0.0]
    #   max: [ 5.0,  3.0, 2.0]
    # This is map-local tuning, not the runtime base_link height. The fitted
    # floor and board points in an aggregated PLY can carry bias.
    board_centre_height: 1.0
    range_min: 0.0
    range_max: .inf
    cluster_tolerance: 0.05
    cluster_min_points: 60
    extent_tolerance: [0.8, 1.5]      # fraction of nominal
    planarity_max_thickness: 0.08
    verticality_max_dot: 0.25
    centre_height_tolerance: 0.30
    # Merged maps do not have one sensor's expected return count.
    density_max_ratio: 1.4
    density_check_enabled: false

anchor:
  floor_band: 0.3                   # metres above the lowest points to fit within
  floor_percentile: 2.0             # percentile taken as "the lowest points"
  floor_inlier: 0.05                # refit tolerance, metres
  floor_refits: 3
  max_floor_tilt_deg: 10.0

covariance:
  # Loose on purpose. The service is called with method=AUTO, so NDT align
  # refines the guess; an over-tight covariance makes it search too small a
  # window, while an over-loose one costs a few hundred milliseconds.
  #
  # Read by reflective_pose_ros, which computes the covariance: it is a
  # property of the detection, not of the stack the pose is handed to.
  sigma_xy_base: 0.15
  sigma_xy_per_metre: 0.03
  sigma_z: 0.10
  sigma_yaw_base: 0.05
  sigma_roll_pitch: 0.02
  safety_factor: 2.0
  unconstrained_axis_sigma: 1.0

ros:
  input_topic: /sensing/lidar/vlp32/velodyne_points
  sensor_frame: velodyne
  base_frame: base_link
  # Feeds detector.scan_count. The expected return count scales with it, so a
  # node accumulating 10 scans against a detector assuming 1 rejects every real
  # board as ten times too dense. Set here once; core derives the rest.
  accumulate_scans: 10

  # Stacking scans assumes a stationary sensor -- nothing deskews them, so a
  # batch taken while the vehicle rolls is smeared and the board's extents
  # measure wrong. The all-in-one node got this from the Autoware velocity
  # gate; the detector now needs its own source, in a message type that does
  # not drag Autoware into the generic package.
  #
  # Empty disables the guard: right on a bench, wrong on a vehicle.
  # nav_msgs/Odometry and geometry_msgs/TwistStamped are both accepted.
  twist_topic: ""
  max_speed_for_accumulation: 0.05

autoware:
  initialize_service: /localization/initialize
  max_speed_for_init: 0.05          # [m/s]
  max_attempts: 5
  # Off by default: a silent fallback to a fixed pose turns a detector failure
  # into a mislocalization report three weeks later.
  fallback_to_user_defined_pose: false

  # How long to wait for a board pose before the attempt budget counts one as
  # spent. Zero disables it.
  #
  # Detection and the service call are two processes now, so an attempt is one
  # pose acted on: a detector that never detects spends no attempts and the
  # fallback never runs. The all-in-one node counted those failures because it
  # owned the detector loop. This bounds that case.
  pose_wait_timeout: 0.0
